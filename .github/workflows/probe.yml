name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/probe_sources.py
