name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity.
# Re-enabling them through the API every week keeps the collectors scheduled.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in collect_energy.yml collect_realestate.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "enabled $wf"
          done
