name: Collect patent data

on:
  schedule:
    - cron: "11 3 * * 3"   # weekly, Wednesday 03:11 UTC (USPTO grants are issued on Tuesdays)
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Historical backfill: 'auto' (USPTO from 2015, Lens from 2024) or YYYY-MM-DD. Empty = normal run."
        default: ""
      backfill_end:
        description: "Backfill end date YYYY-MM-DD (empty = today)"
        default: ""
      backfill_sources:
        description: "Comma list of uspto, lens (empty = all)"
        default: ""
      chain:
        description: "Internal counter for automatic backfill continuation"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-patents
  cancel-in-progress: false

env:
  BACKFILL_START: ${{ inputs.backfill_start }}
  BACKFILL_END: ${{ inputs.backfill_end }}
  BACKFILL_SOURCES: ${{ inputs.backfill_sources }}
  BACKFILL_FLAG: /tmp/backfill_incomplete
  BACKFILL_MINUTES: "150"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest head, not the commit that was current when this run was queued
          sparse-checkout: |
            scrapers
            utils
            scripts
            data/patents

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: USPTO (PatentsView)
        timeout-minutes: 165
        env:
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
        run: python -m scrapers.patents.uspto_collector

      - name: Commit USPTO
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh patents "data(patents): uspto $(date -u +%Y-%m-%d)"

      - name: Worldwide incl. WIPO (Lens.org)
        if: ${{ !cancelled() }}
        timeout-minutes: 165
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: python -m scrapers.patents.lens_collector

      - name: Commit Lens
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh patents "data(patents): lens $(date -u +%Y-%m-%d)"

      - name: Continue unfinished backfill
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: bash scripts/continue_backfill.sh collect_patents.yml
