name: Collect patent data

on:
  schedule:
    - cron: "11 3 * * 3"   # weekly, Wednesday 03:11 UTC (USPTO grants are issued on Tuesdays)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-patents
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: USPTO (PatentsView)
        env:
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
        run: python -m scrapers.patents.uspto_collector

      - name: Worldwide incl. WIPO (Lens.org)
        if: ${{ !cancelled() }}
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: python -m scrapers.patents.lens_collector

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh "data(patents): $(date -u +%Y-%m-%d)"
