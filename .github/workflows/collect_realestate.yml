name: Collect real-estate data

on:
  schedule:
    - cron: "37 1 * * *"   # daily 01:37 UTC (08:37 Vietnam time)
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Result pages per batdongsan search"
        default: ""
      detail_limit:
        description: "New listing detail pages to fetch"
        default: ""

permissions:
  contents: write

concurrency:
  group: collect-realestate
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: batdongsan.com.vn
        env:
          BDS_MAX_PAGES: ${{ inputs.max_pages }}
          BDS_DETAIL_LIMIT: ${{ inputs.detail_limit }}
        run: python -m scrapers.realestate.batdongsan_collector

      - name: Zillow Research (ZHVI / ZORI)
        if: ${{ !cancelled() }}
        run: python -m scrapers.realestate.zillow_collector

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh realestate "data(realestate): $(date -u +%Y-%m-%d)"
