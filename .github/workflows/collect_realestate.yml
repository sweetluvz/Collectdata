name: Collect real-estate data

on:
  schedule:
    - cron: "37 1 * * *"   # daily 01:37 UTC (08:37 Vietnam time)
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Result pages per batdongsan search"
        default: ""
      detail_limit:
        description: "New listing detail pages to fetch"
        default: ""

permissions:
  contents: write

concurrency:
  group: collect-realestate
  cancel-in-progress: false

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest head, not the commit that was current when this run was queued
          sparse-checkout: |
            scrapers
            utils
            scripts
            data/realestate

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: US housing indices (Zillow, FHFA, Realtor.com)
        run: python -m scrapers.realestate.us_housing_collector

      - name: Vietnam listings (Chợ Tốt)
        if: ${{ !cancelled() }}
        run: python -m scrapers.realestate.chotot_collector

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh realestate "data(realestate): indices+chotot $(date -u +%Y-%m-%d)"

  batdongsan:
    needs: public
    if: ${{ !cancelled() }}
    # batdongsan.com.vn blocks GitHub's cloud IPs. Register a self-hosted runner on a machine in Vietnam and
    # set the repository variable BDS_RUNNER to its label (e.g. self-hosted) - see README section 3.5.
    runs-on: ${{ vars.BDS_RUNNER || 'ubuntu-latest' }}
    continue-on-error: ${{ vars.BDS_RUNNER == '' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest head, not the commit that was current when this run was queued
          sparse-checkout: |
            scrapers
            utils
            scripts
            data/realestate

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: batdongsan.com.vn
        env:
          BDS_MAX_PAGES: ${{ inputs.max_pages }}
          BDS_DETAIL_LIMIT: ${{ inputs.detail_limit }}
        run: python -m scrapers.realestate.batdongsan_collector

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh realestate "data(realestate): batdongsan $(date -u +%Y-%m-%d)"
