name: Collect energy data

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours; each run re-pulls a multi-day window, so no hour is lost
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Historical backfill: 'auto' = each source's default start (see README 4.1) or YYYY-MM-DD. Empty = normal run."
        default: ""
      backfill_end:
        description: "Backfill end date YYYY-MM-DD (empty = today)"
        default: ""
      backfill_sources:
        description: "Comma list: era5, airquality, eia, eia_bulk, eia_market, europe_power, europe_price, gb, aemo, nyiso_da, nyiso_rt (empty = all)"
        default: ""
      lookback_days:
        description: "Recent window for a normal run (EIA / weather, weather max 92)"
        default: ""
      chain:
        description: "Internal counter for automatic backfill continuation"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-energy
  cancel-in-progress: false

env:
  BACKFILL_START: ${{ inputs.backfill_start }}
  BACKFILL_END: ${{ inputs.backfill_end }}
  BACKFILL_SOURCES: ${{ inputs.backfill_sources }}
  BACKFILL_FLAG: /tmp/backfill_incomplete
  BACKFILL_MINUTES: "45"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest head, not the commit that was current when this run was queued
          sparse-checkout: |
            scrapers
            utils
            scripts
            data/energy

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Weather, ERA5 & air quality (Open-Meteo)
        timeout-minutes: 45
        env:
          BACKFILL_MINUTES: "30"
          WEATHER_PAST_DAYS: ${{ inputs.lookback_days }}
        run: python -m scrapers.energy.weather_collector

      - name: Commit weather
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh energy "data(energy): weather $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: US grid & markets (EIA)
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        env:
          BACKFILL_MINUTES: "85"
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EIA_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python -m scrapers.energy.eia_collector

      - name: Commit eia
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh energy "data(energy): eia $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Europe power & prices (Energy-Charts)
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        env:
          BACKFILL_MINUTES: "85"
        run: python -m scrapers.energy.europe_collector

      - name: Commit europe
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh energy "data(energy): europe $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Great Britain (Elexon, Carbon Intensity)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          BACKFILL_MINUTES: "15"
        run: python -m scrapers.energy.gb_collector

      - name: Commit gb
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh energy "data(energy): gb $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Australia NEM (AEMO)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        env:
          BACKFILL_MINUTES: "20"
        run: python -m scrapers.energy.aemo_collector

      - name: Commit aemo
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh energy "data(energy): aemo $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: New York prices (NYISO)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          BACKFILL_MINUTES: "15"
        run: python -m scrapers.energy.nyiso_collector

      - name: Commit nyiso
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh energy "data(energy): nyiso $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Continue unfinished backfill
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: bash scripts/continue_backfill.sh collect_energy.yml
