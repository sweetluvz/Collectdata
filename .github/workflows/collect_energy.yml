name: Collect energy data

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours; each run re-pulls a multi-day window, so no hour is lost
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to (re)collect for EIA / ENTSO-E / weather (weather max 92). Use for backfill."
        default: ""

permissions:
  contents: write

concurrency:
  group: collect-energy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Weather & air quality (Open-Meteo)
        env:
          WEATHER_PAST_DAYS: ${{ inputs.lookback_days }}
        run: python -m scrapers.energy.weather_collector

      - name: US grid (EIA-930)
        if: ${{ !cancelled() }}
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EIA_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python -m scrapers.energy.eia_collector

      - name: European grid (ENTSO-E)
        if: ${{ !cancelled() }}
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          ENTSOE_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python -m scrapers.energy.entsoe_collector

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          bash scripts/commit_data.sh energy "data(energy): $(date -u +%Y-%m-%dT%H:%MZ)"
